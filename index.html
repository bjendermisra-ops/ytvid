 const play=(v)=>{if(v&&typeof openVideo==='function')openVideo(v)};
 const filter=f=>{if(typeof setTab==='function')setTab(f);const g=qs('#tabs');if(g){const b=g.querySelector('[data-f="'+f+'"]');if(b)b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}qs('#grid')?.scrollIntoView({behavior:'smooth',block:'start'});navMark(f)};

 function icon(n){const paths={home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/>',heart:'<path d="M20.8 5.5a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.7a5.5 5.5 0 0 0 0-7.8Z"/>',play:'<path d="m7 4 14 8-14 8z"/>',shorts:'<rect x="4" y="3" width="16" height="18" rx="4"/><path d="m10 8 6 4-6 4z"/>'};return '<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[n]+'</svg>'}
 function sectionHead(title,action){const e=make('div','bt-section-head');const h=make('h2',null,title);e.appendChild(h);if(action){const btn=make('button',null,I[uiLang].viewall+' →');btn.type='button';btn.addEventListener('click',action);e.appendChild(btn)}return e}
 function install(){
   if(!qs('.hdr')||!qs('.main')||!qs('#grid')||qs('.bt-hero'))return;

   const themeBtn=make('button','bt-theme-mini',theme==='dark'?'☀':'☾');themeBtn.type='button';themeBtn.setAttribute('aria-label','Change appearance');hdr.insertBefore(themeBtn,qs('#hset'));themeBtn.addEventListener('click',()=>setTheme(theme==='dark'?'light':'dark'));
   const main=qs('.main');const hero=make('section','bt-hero');hero.setAttribute('aria-label','Featured devotional collection');
   hero.innerHTML='<div class="bt-hero-content"><div class="bt-kicker" id="bt-hero-kicker"></div><h1 id="bt-hero-title"></h1><p id="bt-hero-desc"></p><div class="bt-hero-actions"><button type="button" class="bt-primary" id="bt-hero-play"></button><button type="button" class="bt-quiet" id="bt-hero-all"></button></div></div>';
   main.insertBefore(hero,main.firstChild);
   qs('#bt-hero-play').addEventListener('click',()=>play(V().find(v=>v.type==='kartik')||V()[0]));
   qs('#bt-hero-all').addEventListener('click',()=>filter('all'));
   const bar=qs('.bar'),shortcuts=make('div','bt-shortcuts');shortcuts.id='bt-shortcuts';const kb=qs('#kb');kb.insertAdjacentElement('afterend',shortcuts);
   const nav=make('nav','bt-nav');nav.setAttribute('aria-label','BhaktiTube navigation');
   for(const [f,n,labelKey] of [['all','home','home'],['explore','search','find'],['play','play','watch'],['cont','history','hist'],['fav','heart','library']]){
     const b=make('button',(f==='play'?'bt-play-nav':'')+(f==='all'?' active':''));b.type='button';b.dataset.f=f;b.innerHTML=icon(n)+'<span></span>';b.querySelector('span').textContent=I[uiLang][labelKey];b.setAttribute('aria-label',I[uiLang][labelKey]);nav.appendChild(b);
     b.addEventListener('click',()=>{
       if(f==='play'){const id=Object.entries(histories()).sort((a,b)=>(b[1]?.t||0)-(a[1]?.t||0))[0]?.[0];play(V().find(v=>v.id===id)||V()[0]);return}
       if(f==='explore'){qs('#searchInput')?.focus();qs('.bar')?.scrollIntoView({behavior:'smooth',block:'center'});navMark('explore');return}
       filter(f);
     });
   }
   document.body.appendChild(nav);
   const tabs=qs('#tabs');const section=sectionHead(I[uiLang].section);section.id='bt-grid-head';tabs.insertAdjacentElement('beforebegin',section);
   // Live rails are real data-backed. No fabricated watch counts or durations.
   const rails=make('div','bt-rails');rails.id='bt-rails';section.insertAdjacentElement('beforebegin',rails);
   const langBar=qs('#langs');if(langBar&&!langBar.querySelector('[data-l="mr"]')){const b=make('button',null,'मराठी');b.type='button';b.dataset.l='mr';langBar.appendChild(b)}
   if(langBar&&typeof lang!=='undefined')langBar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
   setupSettings();bindShortcuts(shortcuts);localize();updateRails();
   const renderOriginal=window.render;
   if(typeof renderOriginal==='function'){window.render=function(){renderOriginal.apply(this,arguments);updateRails();updateCount()}}
   updateCount();

 function updateRails(){const root=qs('#bt-rails');if(!root)return;root.textContent='';const videos=V();const hist=histories();const continued=videos.filter(v=>hist[v.id]&&hist[v.id].t>10).slice(0,8);if(continued.length){const head=sectionHead(I[uiLang].continue,()=>filter('cont'));const rail=make('div','bt-strip');continued.forEach(v=>rail.appendChild(railCard(v,true)));root.append(head,rail)}
   // A separate Shorts rail (only when not already filtered to Shorts)
   const shorties=videos.filter(v=>v.type==='shorts').slice(0,8);
   if(shorties.length){const head=sectionHead('▶ '+I[uiLang].shorts,()=>filter('shorts'));const rail=make('div','bt-strip');shorties.forEach(v=>rail.appendChild(railCard(v,false)));root.append(head,rail)}
 }
 function updateCount(){const count=qs('#hc');if(count&&typeof view!=='undefined'&&Array.isArray(view))count.textContent=view.length+' '+I[uiLang].video;const h=qs('#bt-grid-head h2');if(h)h.textContent=I[uiLang].section;}
 function setTheme(t){theme=t;document.body.classList.toggle('bt-light',t==='light');try{localStorage.setItem('bt-theme',t)}catch(e){};const b=qs('.bt-theme-mini');if(b)b.textContent=t==='dark'?'☀':'☾';syncExtraButtons()}

 function syncExtraButtons(){document.querySelectorAll('[data-bt-theme]').forEach(b=>b.classList.toggle('on',b.dataset.btTheme===theme));document.querySelectorAll('[data-bt-lang]').forEach(b=>b.classList.toggle('on',b.dataset.btLang===uiLang))}

 function renderExtra(){const e=qs('#bt-settings-extra');if(!e)return;const t=I[uiLang];e.textContent='';const appearance=make('div','bt-settings-label',t.appearance);const options=make('div','bt-options');for(const [v,l] of [['dark',t.dark],['light',t.light]]){const b=make('button',null,l);b.type='button';b.dataset.btTheme=v;options.appendChild(b)}const lan=make('div','bt-settings-label',t.lang);lan.style.marginTop='13px';const lo=make('div','bt-options');for(const [v,l] of [['hi','हिन्दी'],['en','English'],['mr','मराठी']]){const b=make('button',null,l);b.type='button';b.dataset.btLang=v;lo.appendChild(b)}e.append(appearance,options,lan,lo);syncExtraButtons()}

   const search=qs('#searchInput');if(search)search.placeholder=t.search;
   const home=qs('#homeBtn');if(home){home.setAttribute('aria-label',t.home)}
   const navKeys=['home','find','watch','hist','library'];document.querySelectorAll('.bt-nav button').forEach((b,i)=>{const label=t[navKeys[i]];b.querySelector('span').textContent=label;b.setAttribute('aria-label',label)});
   document.querySelectorAll('.bt-shortcut-label').forEach((e,i)=>e.textContent=t.category[i]);
   const filtLabels={all:t.all,cont:'▶ '+t.watching,fav:'♡ '+t.fav,kartik:'🪔 Kartik',kids:'☼ '+t.kids,lecture:t.lectures,P:t.sri,L:t.lok,kirtan:'Kirtan',shorts:'Shorts'};
   Object.entries(filtLabels).forEach(([f,label])=>{const b=qs('#tabs [data-f="'+f+'"]');if(b)b.textContent=label});
   const allLang=qs('#langs [data-l="all"]');if(allLang)allLang.textContent=t.all;
   // Original hardcoded settings config is not removed. Only its visible labels are translated.
   if(typeof SET!=='undefined'){let hi=0;SET.forEach((item,i)=>{if(item.h){item.h=SET_TRANSLATIONS[uiLang].headings[hi++]||item.h}else if(item.k&&SET_TRANSLATIONS[uiLang][item.k]){item.t=SET_TRANSLATIONS[uiLang][item.k]}else if(item.a&&SET_TRANSLATIONS[uiLang][item.a]){item.t=SET_TRANSLATIONS[uiLang][item.a]}})}
   const title=qs('#bt-grid-head h2');if(title)title.textContent=t.section;

 }

 window.BhaktiTubePremium={setTheme,setInterface,refresh:updateRails};

/* Layout preference persists in the same settings object as playback preferences. */
function applyLayout(){
  const columns=S.layout===2?2:1;
  document.body.classList.toggle('bt-grid-2',columns===2);
  document.querySelectorAll('#bt-feed-toolbar [data-layout]').forEach(b=>{const active=Number(b.dataset.layout)===columns;b.classList.toggle('on',active);b.setAttribute('aria-pressed',String(active));});
  const locale=(()=>{try{return localStorage.getItem('bt-ui-lang')||'hi'}catch(_){return 'hi'}})();
  const copy=locale==='en'?['🎬 All videos','List','Grid']:locale==='mr'?['🎬 सर्व व्हिडिओ','सूची','ग्रिड']:['🎬 सभी वीडियो','सूची','ग्रिड'];
  const label=document.getElementById('bt-feed-title');if(label)label.textContent=copy[0];
  const a=document.getElementById('bt-one-label'),b=document.getElementById('bt-two-label');if(a)a.textContent=copy[1];if(b)b.textContent=copy[2];
}
document.getElementById('bt-feed-toolbar')?.addEventListener('click',e=>{
  const btn=e.target.closest('[data-layout]');if(!btn)return;
  const next=Number(btn.dataset.layout);if(next!==1&&next!==2)return;
  if(S.layout===next)return;S.layout=next;save('settings',S);applyLayout();
  if(typeof message==='function')message(next===1?'1 column view':'2 column view');
});
window.addEventListener('bt:languagechange',applyLayout);
applyLayout();
